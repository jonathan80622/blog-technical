name: Enqueue market-map source fetches

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ENQUEUE_2026_10_17 to create the batch's source-fetch jobs.
        required: true
        type: string

permissions:
  contents: read

jobs:
  enqueue:
    if: github.event.inputs.confirmation == 'ENQUEUE_2026_10_17'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the locked application dependencies
        run: npx pnpm@11 install --frozen-lockfile
      - name: Generate the Prisma client
        run: npx pnpm@11 exec prisma generate
      - name: Enqueue the dated source-fetch batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/enqueue-market-map.mjs data/market-map-2026-10-17.json
