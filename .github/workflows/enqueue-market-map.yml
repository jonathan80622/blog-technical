name: Enqueue market-map source fetches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_EXECUTION_MODE: hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the locked application dependencies
        run: npx pnpm@11 install --frozen-lockfile --ignore-scripts
      - name: Generate the Prisma client
        run: npx pnpm@11 exec prisma generate
      - name: Enqueue the dated source-fetch batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/enqueue-market-map.mjs data/market-map-2026-10-17.json
